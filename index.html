
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Spanish Verb Conjugation Practice</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="container">

        <header>
            <h1>Conjugación de Verbos</h1>
            <p>Spanish Verb Practice</p>
        </header>

        <!-- PRACTICE SETTINGS -->
        <section class="settings">
            <h2>Practice Settings</h2>

            <label for="chapter">Chapter Completed</label>
            <select id="chapter"></select>

            <fieldset>
                <legend>Practice Scope</legend>
            
                <label>
                    <input type="radio"
                           name="practiceScope"
                           value="comprehensive"
                           checked>
                    Comprehensive Review
                </label>
            
                <label>
                    <input type="radio"
                           name="practiceScope"
                           value="chapter">
                    Selected Chapter Only
                </label>
            </fieldset>
            
            <fieldset>
                <legend>Show First</legend>

                <label>
                    <input type="radio"
                           name="language"
                           value="spanish"
                           checked>
                    Spanish Infinitive
                </label>

                <label>
                    <input type="radio"
                           name="language"
                           value="english">
                    English Translation
                </label>
            </fieldset>

            <label for="tense">Practice Tense</label>
            <select id="tense"></select>

            <label for="verbLimit">Number of Verbs</label>
            <input type="number"
                   id="verbLimit"
                   min="5"
                   step="1"
                   value="5"
                   required>

            <p id="verbRange"></p>
            <p id="verbCount"></p>

            <button id="startBtn" type="button">
                Start Practice
            </button>
        </section>

        <!-- PRACTICE AREA -->
        <section id="practice" hidden>

            <div class="progress-area">
                <p id="progress"></p>
                <progress id="progressBar"
                          value="0"
                          max="1"></progress>
            </div>

            <div class="verb-heading">
                <p>CONJUGATE THIS VERB</p>
                <h2 id="verbPrompt"></h2>
                <p id="translation" hidden></p>
                <p id="verbChapter"></p>
            </div>

            <div class="table-wrapper">
                <table id="conjugationTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <div class="accent-toolbar">
                <h3>Spanish Characters</h3>
                <div id="accentButtons"></div>
                <p>
                    Select an answer field, then click
                    a character to insert it.
                </p>
            </div>

            <div id="result" aria-live="polite"></div>

            <div class="actions">
                <button id="checkBtn" type="button">
                    Check Answers
                </button>

                <button id="showBtn" type="button">
                    Show Answers
                </button>

                <button id="nextBtn" type="button">
                    Next Verb
                </button>
            </div>

            <div class="statistics">
                <p>Verbs Attempted:
                    <span id="attempts">0</span>
                </p>

                <p>First-Check Accuracy:
                    <span id="accuracy">0%</span>
                </p>
            </div>
        </section>

        <!-- SESSION SUMMARY -->
        <section id="summary" hidden>
            <h2>Practice Complete!</h2>

            <p id="summaryVerbs"></p>
            <p id="summaryAnswers"></p>
            <p id="summaryCorrect"></p>
            <p id="summaryAccuracy"></p>

            <button id="againBtn" type="button">
                Practice Again
            </button>
        </section>

    </main>
</body>
</html>
